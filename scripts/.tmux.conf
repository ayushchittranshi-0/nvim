# remap prefix from 'C-b' to 'C-a'
# unbind-key C-b
# set -g prefix 'C-\'
# bind-key 'C-\' send-prefix

# Preview windows and sessions
# bind-key p choose-tree -Zs

# Everything below is taken from:
# The best and greatest tmux.conf ever
# by Chad Humphries
# https://gist.github.com/spicycode/1229612

# 0 is too far from ` ;). I have practiced the keyboard now and do not need 
# the shortcut anymore.
# set -g base-index 1
set -g renumber-windows on

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g status-keys vi
setw -g mode-keys vi
set -g history-limit 10000

# setw -g mode-keys vi
set -g mouse on
setw -g monitor-activity on

# we will try to go with default shortcuts for now.
# bind-key v split-window -h
# bind-key s split-window -v
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# bind-key M-j resize-pane -D
# bind-key M-k resize-pane -U
# bind-key M-h resize-pane -L
# bind-key M-l resize-pane -R

# Vim style pane selection
# no need for this for now
# bind h select-pane -L
# bind j select-pane -D 
# bind k select-pane -U
# bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D 
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# alt arrow to switch windows
bind -n M-k  previous-window
bind -n M-j next-window
bind -n M-1 switch-client -t ntw
bind -n M-0 switch-client -t vimconfig
bind -n M-2 switch-client -t ntp
bind-key -n M-l switch-client -l
bind-key -n M-h last-window
# bind-key Tab last-window
bind-key -n M-s choose-tree -s
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

# No delay for escape key press
set -sg escape-time 50

# Reload tmux config
bind r source-file ~/.tmux.conf

# Fix Colors
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# THEME
# default statusbar colors
#――――――――――――――――――――――――――――――――
set-option -g status-bg default
set-option -g status-fg colour240
# default window title colors
#―――――――――――――――――――――――――――――――
set-window-option -g window-status-style fg=magenta
set-window-option -g window-status-style bg=default
set -g status-left-length 85
set -g status-left "working on#[fg=colour135] #S#[fg=colour240] »#[fg=colour214] #W "
set -g window-status-current-format "#[fg=black,bold bg=default]│#[fg=white bg=cyan]#W#[fg=black,bold bg=default]│"
set -g window-status-current-format "#[fg=black,bold bg=default]│#[fg=colour135 bg=black]#W#[fg=black,bold bg=default]│"
set -g status-style bg=default
set -g status-right "#[fg=magenta] #[bg=gray] %b %d %Y %l:%M %p"
set -g status-right '#(gitmux "#{pane_current_path}")' 
set -g status-justify centre


# active pane: purple border + full brightness, inactive: dimmed
#―――――――――――――――――――――――――――――――
setw -g pane-active-border-style 'fg=colour135,bold'
setw -g pane-border-style        'fg=colour238'
setw -g pane-border-lines        heavy
setw -g window-style             'fg=colour245'
setw -g window-active-style      'fg=default'
set  -g display-panes-active-colour colour135
set  -g display-panes-colour        colour238
